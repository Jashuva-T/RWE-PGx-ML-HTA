name: ci

on: [push, pull_request]

jobs:
  test-and-demo:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenMP runtime
        run: |
          brew install libomp

      - run: pip install -r requirements.txt && pip install -e .

      - run: pytest -q

      - run: python -m rwe_pgx_ml.pipeline --config config/config.yaml --out results_ci --synthetic

      - name: Diagnose CI environment and metrics
        run: |
          python - <<'PY'
          import json
          import platform
          import sys
          from importlib.metadata import version
          from threadpoolctl import threadpool_info

          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("Architecture:", platform.machine())

          for package in [
              "numpy", "scipy", "pandas", "scikit-learn",
              "xgboost", "matplotlib", "joblib", "threadpoolctl"
          ]:
              print(f"{package}: {version(package)}")

          print("\nNumerical library thread pools:")
          for pool in threadpool_info():
              print(pool)

          with open("results_ci/summary.json") as f:
              summary = json.load(f)

          print("\nRandom Forest metrics:")
          rf = next(
              x for x in summary["delta_rwe_vs_curated"]
              if x["model"] == "random_forest"
          )
          print(json.dumps(rf, indent=2))
          PY

      - name: Compare reproducibility summary
        run: |
          python - <<'PY'
          import json
          import math

          with open("results/summary.json") as f:
              expected = json.load(f)

          with open("results_ci/summary.json") as f:
              actual = json.load(f)

          errors = []

          def compare(a, b, path="$"):
              if type(a) is not type(b) and not (
                  type(a) in (int, float) and type(b) in (int, float)
              ):
                  errors.append(f"{path}: type mismatch")
              elif isinstance(a, dict):
                  if a.keys() != b.keys():
                      errors.append(f"{path}: key mismatch")
                  for key in a.keys() & b.keys():
                      compare(a[key], b[key], f"{path}.{key}")
              elif isinstance(a, list):
                  if len(a) != len(b):
                      errors.append(f"{path}: length mismatch")
                  else:
                      for i, (x, y) in enumerate(zip(a, b)):
                          compare(x, y, f"{path}[{i}]")
              elif type(a) in (int, float):
                  if not math.isclose(a, b, rel_tol=0, abs_tol=5e-4):
                      errors.append(f"{path}: {a} != {b}")
              elif a != b:
                  errors.append(f"{path}: {a} != {b}")

          compare(expected, actual)

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("Reproducibility check passed.")
          PY

      - name: Upload CI diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-results
          path: results_ci/
          if-no-files-found: warn
          retention-days: 7
